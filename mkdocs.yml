site_name: Bible Background
site_description: Reference library of biblical context notes.
site_url: https://woodwardmw.github.io/bible-background/
repo_url: https://github.com/woodwardmw/bible-background
docs_dir: content
use_directory_urls: true
theme:
  name: mkdocs
  locale: en
nav:
- Home: index.md
- Genesis:
  - Overview: genesis/index.md
  - Chapter 2: genesis/2.md
- Judges:
  - Chapter 14: judges/14.md
- Isaiah:
  - Chapter 24: isaiah/24.md
- 1 Peter:
  - Chapter 3: 1-peter/3.md
- Reading days:
  - Fri 21 Aug 2026: days/2026-08-21.md
plugins:
- search
markdown_extensions:
- admonition
- toc:
    permalink: true
